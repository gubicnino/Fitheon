name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # expo-env.d.ts and .expo/types are git-ignored; this generates them
      # without starting the dev server, so the app typecheck can see the
      # CSS module and route declarations.
      - name: Generate Expo types
        run: npm exec -w @fitheon/mobile -- expo customize tsconfig.json
      - name: Lint the app
        run: npm run lint -w @fitheon/mobile
      - name: Typecheck the app
        run: npm run typecheck -w @fitheon/mobile
      - name: Export the app for iOS
        run: npm exec -w @fitheon/mobile -- expo export --platform ios
