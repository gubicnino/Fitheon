name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # expo-env.d.ts and .expo/types are git-ignored; this generates them
      # without starting the dev server, so the app typecheck can see the
      # CSS module and route declarations.
      - name: Generate Expo types
        run: npm exec -w @fitheon/mobile -- expo customize tsconfig.json
      - name: Lint the app
        run: npm run lint -w @fitheon/mobile
      - name: Typecheck the app
        run: npm run typecheck -w @fitheon/mobile
      - name: Export the app for iOS
        run: npm exec -w @fitheon/mobile -- expo export --platform ios

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      # The root tsc cannot see Deno code, so the functions get their own checks.
      - name: Lint the functions
        run: deno lint supabase/functions
      - name: Typecheck the functions
        run: find supabase/functions -name '*.ts' -print0 | xargs -0 deno check --no-lock --config supabase/functions/deno.json
      # Only what the tests use: database, auth, the Data API, the gateway and
      # the function runtime. The Supabase CLI is the version from package-lock.json.
      - name: Start the local Supabase stack
        run: npx supabase start -x studio,mailpit,imgproxy,vector,logflare,realtime,storage-api,postgres-meta,supavisor
      - name: Serve the functions
        run: npx supabase functions serve > functions.log 2>&1 &
      - name: Wait for the API and the functions
        run: |
          API_URL=$(npx supabase status -o env | sed -n 's/^API_URL="\(.*\)"$/\1/p')
          for i in $(seq 1 60); do
            auth=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/auth/v1/health" || true)
            fn=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/functions/v1/" || true)
            echo "auth: $auth, functions: $fn"
            if [ "$auth" != "000" ] && [ "$fn" != "000" ] && [ "$fn" != "502" ] && [ "$fn" != "503" ]; then exit 0; fi
            sleep 2
          done
          echo "the stack did not become ready"
          cat functions.log
          exit 1
      - name: Run the backend tests
        run: npm run test:backend
      - name: Show the function logs
        if: failure()
        run: cat functions.log
      - name: Stop the stack
        if: always()
        run: npx supabase stop --no-backup
